# WiNet-S2 (SV300, ESP32-S3), Ethernet (W5500 on SPI3).
# Production firmware: RS485 autodetect of the inverter and the devices it reports (batteries, EV
# charger, Energy Bridge), iSolarCloud uplink, Modbus-TCP :502, gated register writes, per-device
# Home Assistant discovery over MQTT, the web UI, diagnostic captures and reset diagnostics.
# Board specifics live in boards/winet_s2.yaml. A site file (sites/README.md) includes this entry and
# sets its own name and options.
substitutions:
  name: winet-s2-eth
  friendly_name: WiNet-S2 eth

packages:
  board: !include boards/winet_s2.yaml
  base: !include common/base.yaml
  # API key and web login from secrets.yaml (the prebuilt entries use common/provisioning.yaml).
  access: !include common/access_secrets.yaml
  # Network: W5500 SPI Ethernet in place of Wi-Fi (ESPHome runs one or the other), for a unit
  # wired to the W5500. Wi-Fi: winet-s2.yaml.
  network: !include boards/winet_s2_ethernet.yaml
  board_io: !include common/board_io.yaml
  rs485: !include common/rs485.yaml
  identity: !include common/identity.yaml
  cloud: !include common/cloud.yaml
  modbus_tcp: !include common/modbus_tcp.yaml
  # Register writes, off until the "Inverter writes enabled" switch is turned on (docs/control.md).
  control: !include common/control.yaml
  # Register writes: the control profile (hybrid or string) attaches itself from the inverter's
  # device type; MQTT discovery and the web UI expose its controls. Native-API control entities
  # are part of common/native_entities.yaml.
  # Every connected device as its own Home Assistant device over MQTT discovery.
  mqtt_ha: !include common/mqtt_ha.yaml
  # ha_native: !include common/native_entities.yaml   # native-API entities instead of mqtt_ha (no broker); do not use both
  web_ui: !include common/web_ui.yaml
  # I-V scan and grid-waveform captures (web UI Captures page).
  capture: !include common/capture.yaml
  # Reset journal, log tail, panic hook, task-watchdog panics, "Last reset" (common/diagnostics.yaml).
  diagnostics: !include common/diagnostics.yaml
  # Daily anonymous usage report and diagnostics uploads; analytics: "false" turns it off (docs/analytics.md).
  analytics: !include common/analytics.yaml
  # Remote logging: set syslog_host under substitutions and uncomment.
  # syslog: !include common/syslog.yaml

external_components:
  - source:
      type: local
      path: components
