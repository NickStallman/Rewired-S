# Optional network package for the WiNet-S2: W5500 SPI Ethernet instead of Wi-Fi.
# Use it in winet-s2.yaml in place of common/wifi.yaml (ESPHome can't run both).
# Pin assignments: https://github.com/NickStallman/SG-Docs/blob/main/reference/hardware/winet-s2.md
ethernet:
  type: W5500
  interface: spi3      # stock uses SPI3_HOST; SPI2 is the external NOR
  clk_pin: GPIO39
  mosi_pin: GPIO40
  miso_pin: GPIO41
  cs_pin: GPIO42
  interrupt_pin: GPIO6
  reset_pin: GPIO5     # the IDF default, as in the stock PHY config
  clock_speed: 36MHz

text_sensor:
  - platform: ethernet_info
    ip_address:
      name: IP address

# The app descriptor's version carries the network kind ("0.9.2+ethernet"): the boot-slot page and the
# network fallback (common/ethernet_fallback.yaml) read it from the other OTA slot.
esp32:
  framework:
    sdkconfig_options:
      CONFIG_APP_PROJECT_VER_FROM_CONFIG: "y"
      CONFIG_APP_PROJECT_VER: '"${project_version}+ethernet"'
