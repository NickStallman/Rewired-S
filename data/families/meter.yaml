fixes:
- {table: other_dev18_st6100, id: 0x210E, stock_address: 4161, address: 4163, confidence: likely, evidence: "the stock table entry (idx 34) holds regaddr 0x1041, in the WiNet-S and WiNet-S2 images alike. PF-C 0x210d@4161+2 is fixed by three tables (st6100, st6200, tcpslave_dev18), so the six per-phase energy u32s that follow can only sit at 4163..4173 without overlap: the firmware has an off-by-2 in 0x210e and the rest chain from it. As shipped, 0x210e decodes PF-C's registers and 0x2113 misses its real register. st6100 is the Acrel DTSD1352 layout (https://github.com/NickStallman/SG-Docs/blob/main/reference/appendix/register-tables/rs485-meter-dtsd1352.md)"}
