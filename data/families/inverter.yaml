- id: 0x2086
  key: device_state
  name: "Operating status"
  category: core
  priority: 8
  enum: device_state
  confidence: confirmed
  evidence: "p1_4@5038 p2@5221 p3@5221 p5@13000 slave1_21@5038 slave1_21@5221 slave35@13000; stock UI label \"Device status\"; SunGather 5038 work_state_1; mkaiser 13000 \"Running state raw\"; SunGather 13000 system_state; state coding depends on the map: public 5038 (SG work state 0x0000 run, 0x8000 stop...) vs 13000 (SH system state 0x0040 run, 0x0002 stop...); the codes do not overlap, the package map merges both (mkaiser \"Sungrow inverter state\" template); readings (protocol 3): SH10RS 33280, SG5.0RS 0; reads 0x8200 = Dispatched running (SH10RS), 0x0000 = Running (SG5.0RS); the SH10RS power stage produces 0x1200/0x1300/0x1400/0x1500/0x1600/0x1800/0x1900/0x2000/0x5500/0x8100/0x8200/0x9100/0x4001/0x1000/0x0400/0x0800/0x4000 and the ARM adds 0x2500 and the poll-timeout 0x1400; the SG5.0RS power stage produces 0x0000/0x1200/0x1300/0x1400/0x1500/0x1600/0x5500/0x8100/0x8200/0x9100 and 0xA100 (low-PV wait, doc 32501), and reports rapid shutdown as 0x1300 (https://github.com/NickStallman/SG-Docs/blob/main/reference/devices/sh10rs/registers.md, https://github.com/NickStallman/SG-Docs/blob/main/reference/devices/sg5rs/registers.md)"
- id: 0x2556
  key: power_flow_status
  name: "Power flow status"
  category: hidden
  scope: hybrid
  confidence: confirmed
  evidence: "p2@6099 p3@6099 slave35@13001; mkaiser 13001 \"Power Flow Status\"; SunGather 13001 running_state; SunGather 13001 state_power_generated_from_pv; SunGather 13001 state_battery_charging; SunGather 13001 state_battery_discharging; SunGather 13001 state_load_active; SunGather 13001 state_feed_into_grid; SunGather 13001 state_import_from_grid; SunGather 13001 state_power_generated_from_load; no point entry; slave35 exports this sigid at public 13001 = mkaiser \"Power Flow Status\" bitfield (bit0 PV, 1 batt charging, 2 batt discharging, 3 positive load, 4 feed-in, 5 import, 7 negative load); polled at private 6099; readings (protocol 3): SH10RS 43, SG5.0RS absent; readings decode consistently: 43 = PV + battery charging + load + importing (battery -932 W), 25 = PV + load + exporting (export_power +1.998 kW, battery full); hidden as a raw number, published as text by the derived power_flow (derived.cpp power_flow_text)"
- id: 0x5006
  key: power_flow_status_sh
