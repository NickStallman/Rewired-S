- key: grid_country_code
  name: "Country/region (str_pv map)"
  fn: 3
  address: 30500
  dtype: u16
  group: protection
  priority: 500
  enum: country
  confidence: confirmed
  evidence: "str_pv grid profile item register holding 30500 (list, 6 = Australia); str_pv country register (stock descriptor (0,1) country_reg 30500)"
