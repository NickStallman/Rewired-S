# data/families/charger.yaml - register tables and signal definitions of the charger family
# (docs/data_format.md). Read by tools/gen_tables.py and tests/test_request_nodes.py.
#
# tables.<name>.rows   one entry per polled register block, in poll order:
#   id          signal id (family-scoped, hex); 0 = a gap-filling read that stores nothing
#   address     1-based register number (wire address = address - 1)
#   fn          Modbus function: 4 input, 3 holding, 16 write-multiple, 119 proprietary
#   count       registers read;  type  s16 u16 s32 u32 s64 u64 f32 str
#   cycle       poll cycle in 100 ms units; a request node is polled at the cycle of its first row
#   flags       end = the row closes its request node (nodes also split past 120 registers);
#               clear_offline / priority / no_bulk_decode / keep_sentinel
#   bits        {first, count}: a status word whose bits are published as signals first + bit
#   capability  word.bit of the capability bitmap (signal 0x2181) that must be set for the row
#   unit, scale only for rows without a signal definition (otherwise taken from the signal)
# signals   one entry per signal id: key (stable entity key, unique per family), name, unit,
#   scale (omitted = raw value), device_class / state_class (Home Assistant), category
#   (core | core_hybrid | core_string | extra | hidden; omitted = placed explicitly by the
#   device package definition), scope (hybrid = meaningless on a string inverter), priority
#   (display sort rank, lower first), group (realtime | static | protection), accuracy
#   (display decimals), enum (decode table name), absent (not-served conditions), confidence
#   (confirmed | likely | guess) and evidence. Signal order = entity order of the packages.
# fixes     rows whose address differs from the one the stock dongle polls (row carries the fix)
# reads     non-polled holding registers surfaced read-only (inverter protection settings)
#
# Evidence abbreviations: p1_4 / p2 / p3 / p5 = rows of tables.inv_proto*, slaveNN = rows of
# the data/modbus_tcp map of dev_type NN, battery / st6100 / ... = rows of that table, all as
# <table>@<address>; mkaiser N = github.com/mkaiser/Sungrow-SHx-Inverter-Modbus-Home-Assistant
# modbus_sungrow.yaml (register N); SunGather N = github.com/bohdan-s/SunGather
# registers-sungrow.yaml; readings = values read from an SH10RS and an SG5.0RS (protocol 3);
# SG-Docs = https://github.com/NickStallman/SG-Docs.

