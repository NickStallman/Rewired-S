# data/installer_rules.yaml - value rules the server enforces on Installer writes
# (docs/data_format.md). Read by tools/gen_installer_rules.py (imported by
# tools/gen_installer_settings.py) -> installer_rules.gen.h / installer_settings.gen.ts.
#
# families.<settings family>[]  one rule per holding register (1-based address):
#   type        U16 | S16 | U32 (U32 = low word at address)
#   scale       display = raw x scale;  unit  display unit
#   range       intervals in display units, [lo, hi] each; the enforced raw range is the
#               overall minimum .. maximum, raw = round(display / scale)
#   regulation  ';'-separated relations that must all hold, @N = the value of register N
#               (same scale on both sides); simple `@a op @b` rules are enforced by the
#               server, the whole string is evaluated by the SPA for inline feedback
# A register with a live range callback in the inverter keeps its static range here (the
# live one can only be narrower).

