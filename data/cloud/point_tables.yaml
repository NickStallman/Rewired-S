# data/cloud/point_tables.yaml - iSolarCloud point ids per cloud table type (docs/data_format.md).
# Read by tools/gen_mqtt_table.py -> components/isolarcloud/mqtt_point_table.{h,cpp}.
#
# tables[].table_type       the table the device model selects (= its dev_type)
# tables[].cloud_device_type the devType the cloud expects in businessData for that table
# points[]  signal  the signal id read from the signal store (family of the device)
#           point   cloud point id (rundata / propertydata key); -1 for placeholder rows
#           attrs   which uplink messages carry it: attributes, rundata, status, general
#           format  encoder: 3/4 int16, 5/6 int32, 8 int64, 9 float32 x scale, 10 double x scale,
#                   12 string, 13/101 hex (components/isolarcloud/rundata_format.cpp)
#           scale, size (bytes), type (s16 u16 s32 u32 s64 u64 f32 str none)
# Row order = publication order of the rundata keys.

notes: |
  The repointed rows (comment `repointed`) are the project's own corrections: the stock table
  references signal ids that the public register map never populates for string inverters
  (table types 0x01 / 0x15), so those points arrived blank. They now read the signal our
  register tables fill for the same quantity (size, format and scale unchanged, checked
  on an SG5.0RS). Grid frequency on protocol 3 is 0x208C (0.01 Hz), the only populated one.
tables:
- table_type: 0x01
  cloud_device_type: 1
  title: "string inverter (dev_type 1)"
  points:
