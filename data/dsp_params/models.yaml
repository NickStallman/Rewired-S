# Inverter firmware lines whose power-stage parameter acceptance ranges are known.
#
# One row per power-stage firmware line (a line is shared by every model the same package
# updates): a `key` for the generated identifiers, a short `name`, the `family` (hybrid |
# string), the power-stage `firmware` the ranges were read from, the `csv` with the ranges
# (doc_reg, count, min, max, label, unit), the `models` the line covers (the model string the
# inverter reports in its devinfo block, as the stock dongle shows it) and, when seen on
# hardware, the `dev_codes` those models report (model -> devinfo device code).
#
# The power stage silently ignores a parameter write outside its range while the control board
# acknowledges it, so the firmware refuses (installer writes) or skips (profile writes) such
# values on a listed model and applies no range check for any other. A device is matched by
# its device code first, then by its model string; a model string that is not listed anywhere
# gets no table.
#
# Adding a line: add its row and CSV here, then run `make gen`. Adding a model to a line: list
# it under `models` (and its code under `dev_codes` once a dongle has reported it).
models:
  - key: SH_RS
    name: SH-RS
    family: hybrid
    firmware: SUNSTONE-H_03021.01.16
    csv: sh10rs.csv
    models: [SH3.0RS, SH3.6RS, SH4.0RS, SH5.0RS, SH5.0RS-20, SH6.0RS, SH6.0RS-20, SH8.0RS, SH10RS]
    dev_codes:
      SH10RS: 3355          # 0x0D1B
  - key: SG_RS
    name: SG-RS
    family: string
    firmware: SUNSTONE-S_03011.01.36
    csv: sg5rs.csv
    models: [SG2.0RS-S, SG2.5RS-S, SG3.0RS, SG3.0RS-S, SG3.0RS-L, SG3.3RS-L, SG3.6RS, SG4.0RS, SG4.0RS-L,
             SG4.6RS-L, SG5.0RS, SG5.0RS-ADA, SG5.0RS-L, SG6.0RS, SG6.0RS-L, SG7.5RS-L, SG8.0RS, SG8.0RS-L,
             SG9.0RS, SG9.0RS-L, SG10RS, SG10RS-L]
    dev_codes:
      SG5.0RS: 9734         # 0x2606
  - key: SH_T
    name: SH-T
    family: hybrid
    firmware: PEARL-H_03011.01.45
    csv: sh15t.csv
    models: [SH5T, SH6T, SH8T, SH10T, SH12T, SH15T, SH20T, SH25T,
             SH5T_V12, SH6T_V12, SH8T_V12, SH10T_V12, SH12T_V12, SH15T_V12, SH20T_V12, SH25T_V12]
    dev_codes:
      SH15T: 3621           # 0x0E25
