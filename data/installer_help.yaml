# data/installer_help.yaml - plain-English help / tooltips of the Installer catalogue
# (docs/data_format.md). Keyed by settings family, then the 1-based holding register.
# Read by tools/gen_installer_settings.py into installer_settings.gen.ts `help`.
# One short sentence per register. Acronyms: Volt-VAR = reactive power vs voltage Q(V);
# Volt-Watt = active power vs voltage P(V); LVRT/HVRT = low/high voltage ride-through.

str_pv:
  # --- General runtime / country ---
  30092: "Time the grid must stay within limits after a fault before the inverter leaves the fault state (seconds); the normal reconnection delay then follows."
  30500: "Select the grid country/region. The grid-profile apply then writes that region's protection limits; the power stage itself does not reload defaults on a country change."
  30430: "Enables automatic reconnection after a protection trip instead of needing a manual restart."

  # --- Grid voltage rise suppression (Volt-Watt P(V)) ---
  30266: "Enables grid voltage-rise suppression (Volt-Watt): reduce active power when grid voltage climbs."
  31230: "Enables the Volt-Watt P(V) curve that curtails active power as grid voltage rises."
  31231: "Volt-Watt voltage breakpoint 1 (start of active-power reduction)."
  31232: "Volt-Watt voltage breakpoint 2."
  31233: "Volt-Watt voltage breakpoint 3."
  31234: "Volt-Watt voltage breakpoint 4 (full curtailment)."
  31235: "Active-power limit at Volt-Watt voltage breakpoint 1 (% of rated)."
  31236: "Active-power limit at Volt-Watt voltage breakpoint 2 (% of rated)."
  31237: "Active-power limit at Volt-Watt voltage breakpoint 3 (% of rated)."
  31238: "Active-power limit at Volt-Watt voltage breakpoint 4 (% of rated)."

  # --- 10-minute average overvoltage protection ---
  30295: "Enables 10-minute average overvoltage protection (sustained grid overvoltage)."
  30296: "10-minute overvoltage trip threshold — inverter disconnects above this voltage (V)."
  30297: "10-minute overvoltage recovery threshold the voltage must fall below to reconnect (V)."

  # --- Ramp-rate limiting (active/reactive power) ---
  31200: "Enables ramp-rate limiting of active/reactive power changes (smooth power ramps)."
  31201: "Maximum rate of active/reactive power decrease (% of rated per minute)."
  31202: "Maximum rate of active/reactive power increase (% of rated per minute)."

  # --- Ride-through ---
  30801: "Enables Low-Voltage Ride-Through — stay connected through brief grid voltage dips."
  31000: "Enables High-Voltage Ride-Through — stay connected through brief grid voltage swells."

  # --- Over-frequency active power response (Freq-Watt droop, P(f)) ---
  31400: "Enables over-frequency active-power reduction (Freq-Watt): curtail power when grid frequency rises."
  31404: "Over-frequency droop frequency breakpoint F1 (start of curtailment)."
  31405: "Over-frequency droop frequency breakpoint F2."
  31406: "Over-frequency droop frequency breakpoint F3."
