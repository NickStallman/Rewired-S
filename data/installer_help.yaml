  # --- Under-frequency active power response (Freq-Watt uprating) ---
  31420: "Enables under-frequency active-power increase (raise output when grid frequency drops)."

  # --- Reactive power regulation ---
  31605: "Reactive-power control mode: Off, fixed power factor, fixed Q, Q(P) or Volt-VAR Q(V)."
  31608: "Fixed power factor setpoint used in power-factor reactive mode (signed, +lead/-lag)."

  # --- Volt-VAR Q(V) curve (AU) ---
