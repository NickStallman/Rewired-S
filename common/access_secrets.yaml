# Access credentials from secrets.yaml, for every compiled (non-prebuilt) entry: the native API
# encryption key and the web UI's digest login. The pre-built images use common/provisioning.yaml
# instead (Home Assistant sets the API key at adoption; the login is changed from the web UI).
api:
  encryption:
    key: !secret api_encryption_key
  # Never reboot for want of a Home Assistant client: MQTT, the cloud and :502 do not need it,
  # and stock never reboots for a lost uplink or client.
  reboot_timeout: 0s

ota:
  # Encrypted OTA reusing the api key (no separate password).
  - platform: esphome
    encryption: {}

web_server:
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
